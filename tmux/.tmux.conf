unbind r
bind r source-file ~/.tmux.conf

set -g base-index 1

set -g prefix C-s

setw -g mode-keys vi
set -g mouse on

set -g set-clipboard on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key m choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"
bind-key M choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"

set -g status-position top

set -g default-terminal "xterm-256color"
set-option -ga terminal-features 'xterm-256color:RGB'
set-option -ga terminal-overrides ",xterm-256color:RGB"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'dracula/tmux'
set -g @dracula-border-contrast false

set -g @dracula-show-powerline true
set -g @dracula-show-edge-icons false
# set -g @dracula-show-left-icon "#h"
set -g @dracula-left-icon-padding 0

set -g @dracula-cwd-max-dirs "0"
set -g @dracula-cwd-max-chars "32"

set -g @dracula-plugins "cwd git time"

set -g @dracula-git-no-repo-message "-"

set -g @dracula-show-timezone false
set -g @dracula-time-format "%H:%M"

set -g @dracula-git-colors "dark_purple white"
set -g @dracula-time-colors "light_purple dark_gray"

# set -g @dracula-plugins "cwd cpu-usage ram-usage"
#
# set -g @dracula-cpu-usage-colors "dark_purple white"
# set -g @dracula-ram-usage-colors "light_purple dark_gray"

set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
