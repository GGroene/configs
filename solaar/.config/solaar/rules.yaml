---
- Rule:
  - Key: [Middle Button, pressed]
  - KeyPress:
    - Super_L
    - click
- Rule:
  - MouseGesture: Mouse Up
  - KeyPress:
    - [Super_L, f]
    - click
- Rule:
  - MouseGesture: Mouse Right
  - KeyPress:
    - Next
    - click
- Rule:
  - MouseGesture: Mouse Left
  - KeyPress:
    - Prior
    - click
- Rule:
  - MouseGesture: Mouse Down
  - KeyPress:
    - [Super_L, c]
    - click
- Rule:
  - Rule:
    - Test: thumb_wheel_down
    - MouseScroll: [-1, 0]
    - KeyPress:
      - Left
      - click
  - Rule:
    - Test: thumb_wheel_up
    - MouseScroll: [-1, 0]
    - KeyPress:
      - Right
      - click
- Rule:
  - Key: [Lock PC, pressed]
  - KeyPress:
    - Menu
    - click
